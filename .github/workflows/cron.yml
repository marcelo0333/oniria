# Agendador gratuito para quem não usa Vercel (Railway, Render, Fly, VPS).
# Configure em Settings → Secrets and variables → Actions: APP_URL (https://seudominio.com.br) e CRON_SECRET.
# No Vercel, o vercel.json já agenda os mesmos horários: desative este workflow para não rodar em dobro.
name: Cron diário
on:
  schedule:
    - cron: "5 3 * * *"   # 00h05 em Brasília: pré-gera os horóscopos do dia
    - cron: "0 10 * * *"  # 07h00 em Brasília: e-mail matinal
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.CRON_ENABLED != 'false' }}
    steps:
      - name: Chamar o endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then TASK=emails; else TASK=horoscopes; fi
          curl -fsS --max-time 290 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/daily?task=$TASK"
